<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} · {{ site.app_name }}{% else %}{{ site.app_name }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.app_description }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.app_name }}{% else %}{{ site.app_name }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.app_description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/appicon.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/assets/appicon.png' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  {% if site.enable_smart_app_banner and site.ios_app_id %}
  <meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/main.css' | relative_url }}">

  {%- comment -%}
    Applied before first paint so a reader who chose light does not get a
    flash of the dark theme on every navigation. Inline for the same reason —
    a linked file would arrive too late to matter.
  {%- endcomment -%}
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('yuzic-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved || (prefersLight ? 'light' : 'dark');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
</head>
