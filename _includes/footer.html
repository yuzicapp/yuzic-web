<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <span>© {{ 'now' | date: "%Y" }} {{ site.your_name }}</span>
    <nav class="site-footer__links" aria-label="Footer">
      <a href="{{ site.github_repo_url }}">GitHub</a>
      {% if site.discord_link %}<a href="{{ site.discord_link }}">Discord</a>{% endif %}
      <a href="{{ '/changelog/' | relative_url }}">Changelog</a>
      <a href="{{ '/privacypolicy/' | relative_url }}">Privacy</a>
      <a href="{{ '/tos/' | relative_url }}">Terms</a>
    </nav>
  </div>
</footer>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      try { localStorage.setItem('yuzic-theme', isLight ? 'dark' : 'light'); } catch (e) {}
    });
  })();
</script>
