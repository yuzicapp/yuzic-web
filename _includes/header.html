<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/appicon.png' | relative_url }}" alt="">
      {{ site.app_name }}
    </a>

    <nav class="site-nav" aria-label="Site">
      <a class="is-optional" href="{{ '/#features' | relative_url }}">Features</a>
      <a href="{{ '/changelog/' | relative_url }}">Changelog</a>
      <a class="is-optional" href="{{ site.github_repo_url }}">GitHub</a>

      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch between light and dark">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
