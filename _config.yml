# Yuzic — site configuration
#
# What used to live here was a template's control panel: twenty colour keys,
# a device-frame colour, header overlay transparencies. That is what a
# re-skinnable fork needs and what a real site does not. Colours now live in
# `_sass/_tokens.scss`, where they can also switch theme at runtime.
#
# What is left is content.

app_name: Yuzic
tagline: A music player for the server you already run.
app_description: >-
  Yuzic is a free and open source music player for Navidrome, Jellyfin, Emby
  and other Subsonic servers — with its own audio engine, crossfade, a
  ten-band equalizer and offline downloads.

# Store and source
ios_app_id: 6740042497
ios_app_country: us
appstore_link: https://apps.apple.com/us/app/yuzic-navidrome-jellyfin/id6740042497
playstore_link: https://play.google.com/store/apps/details?id=com.arinora.rawarr
github_repo_url: https://github.com/yuzicapp/yuzic
discord_link: https://discord.gg/NzsGEhg5Fs

enable_smart_app_banner: true

