# Feature List — what the app does, in the app's own terms.
features:

  - title: Unified library across servers
    description: >-
      Connect Navidrome, Jellyfin, Emby and other Subsonic servers. Albums,
      artists, playlists and tracks merge into one library, scoped per server.

  - title: Its own audio engine
    description: >-
      Playback is built on an audio graph written for Yuzic rather than a
      stock player, which is what makes everything below expressible at all.

  - title: Crossfade and gapless
    description: >-
      Fade one track into the next, with a gapless-aware mode that leaves a
      segued album to play through its own joins untouched.

  - title: Ten-band equalizer
    description: >-
      Shape the sound to the room you are in, with replay gain to even out
      volume across a library in album or track mode.

  - title: Offline and downloads
    description: >-
      Download songs, albums and playlists, follow them on one Downloads
      screen, and have new songs arrive automatically. Edits made offline
      replay when you are back.

  - title: In the car
    description: >-
      CarPlay and Android Auto play the quality you actually chose, and the
      lock screen stays in step with the app.

  - title: Yours to arrange
    description: >-
      Light, dark or system, an accent colour, artwork-tinted screens, and
      scales you can move — corner radius, list density, glyph size, columns.

  - title: Reaches everyone
    description: >-
      Screen reader labels on every control, text that scales with your system
      size, and an interface in English, French, Japanese and Chinese.

  - title: Privacy-first by design
    description: >-
      No ads, no tracking, nothing sold. Every outside service stays off until
      you turn it on.


# Servers, integrations and downloaders the app speaks to.
works_with:
  - Navidrome
  - Jellyfin
  - Emby
  - Subsonic
  - Last.fm
  - ListenBrainz
  - MusicBrainz
  - Deezer
  - AudioMuse-AI
  - Lidarr
  - slskd
  - SoulSync
  - DLNA / UPnP
  - AirPlay


